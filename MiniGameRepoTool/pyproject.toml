[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minigame-repo-tool"
version = "0.1.0"
description = "Windows desktop manager for MiniGame multi-repository workspaces"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PySide6-Essentials>=6.11.2,<6.12"]

[project.optional-dependencies]
test = ["pytest>=9.1,<10"]

[project.gui-scripts]
minigame-repo-tool = "repo_tool.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

